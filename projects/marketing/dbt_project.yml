name: marketing
version: '1.0.1'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

vars:
  # Paid to the referrer per referred signup. Must equal REFERRAL_BOUNTY_EUR
  # in scripts/gen_marketing_spend.py.
  referral_bounty_eur: 25.0

seeds:
  marketing:
    # A seed is a full snapshot of its CSV, not an append/incremental target,
    # so it should always be rebuilt from scratch -- see projects/core/dbt_project.yml
    # for why +full_refresh: false is the wrong default (it silently blocks
    # any future column change from landing).
    +full_refresh: true
    +meta:
      owner: "marketing"
      criticality: "CORE"

models:
  marketing:
    +materialized: table
    +meta:
      owner: "marketing"
      criticality: "CORE"
