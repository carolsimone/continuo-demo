name: release

# Release a project change through continuo: build and push the changed
# project's image, then POST the release to continuo, which validates it as a
# candidate release before it promotes it
# (a first release bootstraps only when the repository's continuo binding allows
# it; see scripts/release.sh). dbt compile + manifest upload happen inside
# continuo itself.
#
# The release call goes to continuo's public release API (the repository
# variable CONTINUO_URL) authenticated with this workflow's GitHub Actions OIDC
# token, so the release job needs `id-token: write` and the repository must be
# bound in continuo's `ciAuth.bindings`.
#
# Manual dispatch releases a named project at the current main HEAD, or, when the
# name is ontology, the file ontology/ontology.yaml: the way to release it again when
# the job of its push failed or never started. It can
# force a bootstrap (promote without validation), or a rebaseline: a bootstrap
# that also records every seed at its new content hash, so nothing validates and
# no seed reloads. A rebaseline is the one release per project that continuo's
# upgrade notes ask for after continuo changes its hash formula, when a normal
# release would validate the whole topology and reload every seed. Run one
# dispatch at a time: the concurrency group keeps one waiting run, and a newer
# run cancels it. continuo refuses a bootstrap or a rebaseline from this
# workflow unless the repository's binding sets `allowBootstrap: true`;
# otherwise it needs an operator token (see scripts/release.sh).
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'ontology/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      project:
        description: "Project to release (a projects/<name> directory), or ontology to release ontology/ontology.yaml (force_bootstrap and rebaseline do not apply to it)"
        required: true
        type: string
      force_bootstrap:
        description: "Promote without validation. After continuo changes its hash formula, use rebaseline instead"
        required: false
        default: false
        type: boolean
      rebaseline:
        description: "Re-baseline after continuo changes its hash formula: a bootstrap that also records every seed at its new hash (implies force_bootstrap)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Decide whether this push is releasable and which project it targets. Kept as
  # its own job so a no-op push (CI/tooling/base only — no project changed) skips
  # the release job cleanly via `if:` instead of failing partway through.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.ids.outputs.skip }}
      skip_release: ${{ steps.ids.outputs.skip_release }}
      project: ${{ steps.ids.outputs.project }}
      kind: ${{ steps.ids.outputs.kind }}
      image_tag: ${{ steps.ids.outputs.image_tag }}
      tag: ${{ steps.ids.outputs.tag }}
      release_id: ${{ steps.ids.outputs.release_id }}
      ontology_changed: ${{ steps.ids.outputs.ontology_changed }}
      ontology_release_id: ${{ steps.ids.outputs.ontology_release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff this push against the previous main tip and
          # identify which project changed.
          fetch-depth: 0

      - name: Compute release identifiers + changed project
        id: ids
        run: |
          SHA="$(git rev-parse --short HEAD)"

          # A manually dispatched run names its target project explicitly —
          # required for a forced bootstrap, where no project directory has
          # changed. A push release derives the project from the diff below.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ inputs.project }}"
            # The ontology is not a projects/<project>/ folder. A dispatch for it releases
            # ontology/ontology.yaml at this commit through release-ontology, and no project.
            if [ "${PROJECT}" = "ontology" ]; then
              echo "Dispatched release: the ontology @ ${SHA}"
              {
                echo "skip=true"
                echo "skip_release=true"
                echo "tag=${SHA}"
                echo "ontology_changed=true"
                echo "ontology_release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}-ontology"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ ! -d "projects/${PROJECT}" ]; then
              echo "::error::unknown project '${PROJECT}' — no projects/${PROJECT}/ directory"; exit 1
            fi
            # A project has the kind python when its contracts/ holds *.odcs.yaml files;
            # every other project is a dbt project.
            if compgen -G "projects/${PROJECT}/contracts/*.odcs.yaml" > /dev/null; then KIND="python"; else KIND="dbt"; fi
            echo "Dispatched release: ${PROJECT} @ ${SHA} (kind=${KIND}, force_bootstrap=${{ inputs.force_bootstrap }}, rebaseline=${{ inputs.rebaseline }})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
            echo "release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "project=${PROJECT}" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
            # A dispatch for a project releases that project; the ontology is released by a push that
            # changes its file, or by a dispatch that names it (above).
            echo "ontology_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # continuo models a release as a SINGLE changed project: POST /releases
          # takes one {project, image_tag} and continuo reconstructs the
          # rest of the set from the production pointers. So we diff this
          # push and require exactly one projects/<project>/ to have changed.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BEFORE" ]; then
            echo "::error::cannot determine previous commit to diff against"; exit 1
          fi

          CHANGED="$(git diff --name-only "$BEFORE" HEAD -- 'projects/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          # More than one project is ambiguous under the single-project contract.
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed project per release; found ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          # The ontology is one file, ontology/ontology.yaml, released as its own
          # project by the release-ontology job once the project job has ended. It
          # is not a projects/<project>/ folder, so it never counts toward the one
          # changed project above, and a push that changes a project and the
          # ontology is one release of each, the project first. These outputs are
          # written only after the refusal above, so a refused push exposes none.
          if [ -n "$(git diff --name-only "$BEFORE" HEAD -- ontology/ontology.yaml)" ]; then
            ONTOLOGY_CHANGED=true
          else
            ONTOLOGY_CHANGED=false
          fi
          {
            echo "tag=${SHA}"
            echo "ontology_changed=${ONTOLOGY_CHANGED}"
            echo "ontology_release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}-ontology"
          } >> "$GITHUB_OUTPUT"

          # No project changed → no project to release; skip the release job.
          if [ "$COUNT" -eq 0 ]; then
            echo "No project change in this push — skipping the project release (ontology changed: ${ONTOLOGY_CHANGED})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exactly one project changed → normal single-project release.
          PROJECT="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
          # A project has the kind python when its contracts/ holds *.odcs.yaml files;
          # every other project is a dbt project.
          if compgen -G "projects/${PROJECT}/contracts/*.odcs.yaml" > /dev/null; then KIND="python"; else KIND="dbt"; fi
          echo "Changed project: ${PROJECT} @ ${SHA} (kind=${KIND})"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "release_id=rel-${SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "project=${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Backstop against a wedged step (e.g. a stuck release poll) idling for GitHub's
    # 6-hour default. The budget covers the arm64 half of the image build, which
    # runs under QEMU emulation and is several times slower than the native
    # amd64 half, plus release.sh's own 15-minute POLL_TIMEOUT_SECONDS budget.
    timeout-minutes: 40
    permissions:
      contents: read
      # Lets release.sh request this run's OIDC token for continuo's API.
      id-token: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # Fail before the image build and the S3 upload when continuo's address is
      # not configured, rather than after them.
      - name: Require the CONTINUO_URL repository variable
        if: needs.detect.outputs.skip_release != 'true'
        env:
          CONTINUO_URL: ${{ vars.CONTINUO_URL }}
        run: |
          if [ -z "${CONTINUO_URL}" ]; then
            echo "::error::the repository variable CONTINUO_URL is empty; set it to the origin of continuo's ui"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the changed-project diff resolves.
          fetch-depth: 0

      # A python project (projects/<project>/contracts/*.odcs.yaml) goes
      # through the continuo-python-runtime CLI around the image build: lint
      # the scripts and validate the contracts against the install's warehouse
      # dialect before it, then pack them into the ODCS bundle once the image
      # is pushed. dbt projects skip all of this — their compile leg runs
      # inside continuo itself.
      - name: Set up uv
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        uses: astral-sh/setup-uv@v5

      # The CLI must be the runtime the project image runs: from runtime 0.12.0
      # on, the image's harness recomputes at start the hashes this CLI writes
      # and refuses to run on a mismatch. So the version is read from the
      # project Dockerfile's FROM line, the one place it is written: a runtime
      # upgrade is a change to that line alone, and the step after the install
      # checks that the CLI is that version.
      - name: Read the runtime version from the project image
        id: runtime
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: |
          version="$(python3 scripts/image_pins.py runtime-version "projects/${{ needs.detect.outputs.project }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install continuo-python-runtime
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          uv tool install "continuo-python-runtime==${RUNTIME_VERSION}" || \
            uv tool install "git+https://github.com/carolsimone/continuo-python-runtime@v${RUNTIME_VERSION}"

      - name: Check the installed runtime is the image's
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        # `--color never` keeps forced-colour escapes out of uv's output, and the
        # output is captured first because GitHub's default shell has no pipefail:
        # a failing `uv tool list` would otherwise read as "not installed".
        run: |
          listed="$(uv tool list --color never)"
          python3 scripts/image_pins.py check-installed "projects/${{ needs.detect.outputs.project }}" <<< "$listed"

      # Fast feedback only: this only looks at the project's scripts/. The `pack`
      # below independently lints the script plus its whole in-repo import closure,
      # so a helper outside scripts/ is still covered.
      - name: Lint python scripts (no hand-written SQL)
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: continuo-runtime lint "projects/${{ needs.detect.outputs.project }}/scripts"

      # --dialect postgres checks each declared read against the install's own
      # warehouse dialect, not just sqlglot's dialect-neutral grammar. --project
      # refuses a contract that names another project, and --ontology checks the
      # bindings against the ontology of this checkout, as ci.yml's python-checks
      # does, so a dispatched release meets the pull request's check.
      - name: Validate python contracts
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: continuo-runtime validate "projects/${{ needs.detect.outputs.project }}/contracts" --dialect postgres --project "${{ needs.detect.outputs.project }}" --ontology ontology/ontology.yaml

      # Registers the QEMU binfmt handlers that let this amd64 runner execute
      # arm64 binaries, which is what the linux/arm64 half of the image build
      # below needs to run pip inside the base image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the changed project gets a new image at this commit's tag; the
      # other projects keep the image tags production runs (continuo reuses
      # them via the production pointers), so there is nothing to rebuild.
      #
      # Both platforms are built because the cluster pulling these images decides
      # the architecture, and a single-platform image is simply unpullable
      # elsewhere: an arm64 node rejects an amd64-only manifest list outright
      # ("no matching manifest for linux/arm64"). Apple Silicon laptops running a
      # local kind cluster are the common case that hits this.
      - name: Build and push the changed project image
        if: needs.detect.outputs.skip_release != 'true'
        run: |
          project="${{ needs.detect.outputs.project }}"
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            -t "${DOCKERHUB_USERNAME}/${project}:${{ needs.detect.outputs.tag }}" \
            -t "${DOCKERHUB_USERNAME}/${project}:latest" \
            --cache-from "type=gha,scope=${project}" \
            --cache-to "type=gha,mode=max,scope=${project}" \
            "projects/${project}"

      # continuo runs a Python project's image_tag verbatim — nothing is composed
      # on its side the way the bare short sha is for a dbt release — so this
      # must be the full pullable registry ref, not just the tag the build
      # step above already pushed under.
      - name: Compose full image ref for python release
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: |
          echo "PYTHON_IMAGE_TAG=docker.io/${DOCKERHUB_USERNAME}/${{ needs.detect.outputs.project }}:${{ needs.detect.outputs.tag }}" >> "$GITHUB_ENV"

      # --image is the full ref composed above, so this runs after the image
      # is pushed. --repo-root is the PROJECT's own directory, not the monorepo
      # root: each python project is a self-contained project the same way
      # a dbt project is, and repo-root is what the in-repo import closure
      # (folded into shared_code_hash) resolves against.
      - name: Pack the ODCS bundle
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        run: |
          continuo-runtime pack "projects/${{ needs.detect.outputs.project }}/contracts" \
            --project "${{ needs.detect.outputs.project }}" \
            --repo-root "projects/${{ needs.detect.outputs.project }}" \
            --dialect postgres \
            --image "${PYTHON_IMAGE_TAG}" \
            --out "${RUNNER_TEMP}/odcs-bundle.json"

      # The boundary contract requires this upload to complete before the
      # POST below: continuo does no existence check, so a POST racing its
      # own upload fails at the parsing stage. Endpoint/bucket/region match
      # this repo's own pre-Plan-5 manifest uploads (dbt-loader/targets.yaml,
      # target "hetzner") — the same Hetzner object-storage account continuo's
      # own S3-compatible install still points at.
      - name: Upload odcs-bundle.json to S3
        if: needs.detect.outputs.kind == 'python' && needs.detect.outputs.skip_release != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "${RUNNER_TEMP}/odcs-bundle.json" \
            "s3://continuo-dev/${{ needs.detect.outputs.project }}/${{ needs.detect.outputs.release_id }}/odcs-bundle.json" \
            --endpoint-url https://nbg1.your-objectstorage.com \
            --region eu-central-1

      - name: Drive the release through continuo
        if: needs.detect.outputs.skip_release != 'true'
        env:
          # Origin of continuo's ui, e.g. https://continuo.example.com.
          CONTINUO_URL: ${{ vars.CONTINUO_URL }}
          RELEASE_ID: ${{ needs.detect.outputs.release_id }}
          PROJECT: ${{ needs.detect.outputs.project }}
          # dbt keeps the bare short sha continuo composes into a pull ref
          # itself; python carries the full ref composed above, since
          # continuo runs a python image_tag verbatim.
          IMAGE_TAG: ${{ needs.detect.outputs.kind == 'python' && env.PYTHON_IMAGE_TAG || needs.detect.outputs.image_tag }}
          KIND: ${{ needs.detect.outputs.kind }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          # Renders 'false' on push events, where inputs is empty.
          FORCE_BOOTSTRAP: ${{ inputs.force_bootstrap == true }}
          # Renders 'false' on push events too. release.sh sends a rebaseline
          # as a bootstrap.
          REBASELINE: ${{ inputs.rebaseline == true }}
        run: bash scripts/release.sh

  # The ontology (ontology/ontology.yaml) is released as the project `ontology`,
  # kind `ontology`: continuo reads the file from object storage, so the upload
  # completes before the POST, as the ODCS bundle's does. It runs after the
  # release job, when the same push changes a project, so continuo checks the
  # new project contracts against the ontology the project was written for only
  # once the project itself is released; and only when that release succeeded or
  # was skipped (no project changed). !cancelled() lets it run after a skipped
  # release job, and not in a cancelled run; the detect result is named too, so a
  # refused push, where release is skipped as well, releases nothing. A rejected
  # project release stops it. The pull request that changes the file ran
  # `continuo-contracts ontology check` (ci.yml), so this job runs no check.
  release-ontology:
    needs: [detect, release]
    if: needs.detect.result == 'success' && !cancelled() && needs.detect.outputs.ontology_changed == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    # release.sh's own 15-minute POLL_TIMEOUT_SECONDS budget, plus the checkout and the upload.
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets release.sh request this run's OIDC token for continuo's API.
      id-token: write

    steps:
      # Fail before the upload when continuo's address is not configured.
      - name: Require the CONTINUO_URL repository variable
        env:
          CONTINUO_URL: ${{ vars.CONTINUO_URL }}
        run: |
          if [ -z "${CONTINUO_URL}" ]; then
            echo "::error::the repository variable CONTINUO_URL is empty; set it to the origin of continuo's ui"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Same Hetzner object-storage account and endpoint as the ODCS bundle upload.
      - name: Upload ontology.yaml to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp ontology/ontology.yaml \
            "s3://continuo-dev/ontology/${{ needs.detect.outputs.ontology_release_id }}/ontology.yaml" \
            --endpoint-url https://nbg1.your-objectstorage.com \
            --region eu-central-1

      - name: Drive the ontology release through continuo
        env:
          CONTINUO_URL: ${{ vars.CONTINUO_URL }}
          RELEASE_ID: ${{ needs.detect.outputs.ontology_release_id }}
          PROJECT: ontology
          IMAGE_TAG: ${{ needs.detect.outputs.tag }}
          KIND: ontology
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/release.sh
