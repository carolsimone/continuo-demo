name: ci

# continuo models a release as a SINGLE changed service (see release.yml), so a
# PR touching more than one services/<svc>/ can never be released as-is. Catch
# that at PR time instead of letting it land on main and fail release.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/release.sh'
      - 'scripts/image_pins.py'
      - 'scripts/tests/test_release_sh.py'
      - 'scripts/tests/test_image_pins.py'
      - 'scripts/tests/test_workflows.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

jobs:
  check-single-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      service: ${{ steps.check.outputs.service }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff the PR's base against its head.
          fetch-depth: 0

      - name: Ensure at most one service changed
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED="$(git diff --name-only "$BASE" "$HEAD" -- 'services/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed service per release; this PR touches ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          echo "OK: ${COUNT} service(s) changed"

          if [ "$COUNT" -eq 1 ]; then
            SERVICE="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
            # A service is python iff it declares contracts/ (a python-node
            # service directory); every other service is a dbt project. This
            # mirrors release.yml's own detect job so a PR is checked the same
            # way its eventual release would be.
            if [ -d "services/${SERVICE}/contracts" ]; then KIND="python"; else KIND="dbt"; fi
            echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          fi

  # Python services skip dbt entirely, so nothing above exercises their
  # contracts or scripts. Run the same gate release.yml runs before it ever
  # builds an image, so a broken contract/script fails the PR instead of the
  # push-to-main release.
  python-checks:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The CLI must be the runtime the service image runs: from runtime 0.12.0
      # on, the image's harness recomputes at start the hashes this CLI writes
      # and refuses to run on a mismatch. So the version is read from the
      # service Dockerfile's FROM line, the one place it is written: a runtime
      # upgrade is a change to that line alone, and the step after the install
      # checks that the CLI is that version.
      - name: Read the runtime version from the service image
        id: runtime
        run: |
          version="$(python3 scripts/image_pins.py runtime-version "services/${{ needs.check-single-service.outputs.service }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install continuo-python-runtime
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          uv tool install "continuo-python-runtime==${RUNTIME_VERSION}" || \
            uv tool install "git+https://github.com/carolsimone/continuo-python-runtime@v${RUNTIME_VERSION}"

      - name: Check the installed runtime is the image's
        # `--color never` keeps forced-colour escapes out of uv's output, and the
        # output is captured first because GitHub's default shell has no pipefail:
        # a failing `uv tool list` would otherwise read as "not installed".
        run: |
          listed="$(uv tool list --color never)"
          python3 scripts/image_pins.py check-installed "services/${{ needs.check-single-service.outputs.service }}" <<< "$listed"

      - name: Lint python scripts (no hand-written SQL)
        run: continuo-runtime lint "services/${{ needs.check-single-service.outputs.service }}/scripts"

      - name: Validate python contracts
        run: continuo-runtime validate "services/${{ needs.check-single-service.outputs.service }}/contracts" --dialect postgres

  # A dbt image pins every dbt package, so a rebuild cannot change the macros
  # dbt runs without a reviewed change to its Dockerfile.
  dbt-checks:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'dbt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the dbt pins of the service image
        run: python3 scripts/image_pins.py check-dbt "services/${{ needs.check-single-service.outputs.service }}"

  # The scripts CI and CD run, and the wiring of the workflows, are tested on
  # every change to them: release.sh against a stub of continuo's release API,
  # the image pins, and the text of both workflows.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck release.sh
        run: shellcheck scripts/release.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Test the scripts
        run: uvx pytest==9.1.1 scripts/tests/test_release_sh.py scripts/tests/test_image_pins.py scripts/tests/test_workflows.py -v
