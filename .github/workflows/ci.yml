name: ci

# continuo models a release as a SINGLE changed service (see release.yml), so a
# PR touching more than one services/<svc>/ can never be released as-is. Catch
# that at PR time instead of letting it land on main and fail release.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/release.sh'
      - 'scripts/image_pins.py'
      - 'scripts/tests/test_release_sh.py'
      - 'scripts/tests/test_image_pins.py'
      - 'scripts/tests/test_workflows.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

jobs:
  check-single-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      service: ${{ steps.check.outputs.service }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff the PR's base against its head.
          fetch-depth: 0

      - name: Ensure at most one service changed
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED="$(git diff --name-only "$BASE" "$HEAD" -- 'services/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed service per release; this PR touches ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          echo "OK: ${COUNT} service(s) changed"

          if [ "$COUNT" -eq 1 ]; then
            SERVICE="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
            # A service is python-odcs iff its contracts/ holds *.odcs.yaml
            # files; every other service is a dbt project. This mirrors
            # release.yml's own detect job so a PR is checked the same way its
            # eventual release would be.
            if compgen -G "services/${SERVICE}/contracts/*.odcs.yaml" > /dev/null; then KIND="python-odcs"; else KIND="dbt"; fi
            echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          fi

  # Python services skip dbt entirely, so nothing above exercises their
  # contracts or scripts. Run the same gate release.yml runs before it ever
  # builds an image, so a broken contract/script fails the PR instead of the
  # push-to-main release, plus a dry run of the `pack` release.yml runs after
  # the build.
  python-checks:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'python-odcs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The CLI must be the runtime the service image runs: from runtime 0.12.0
      # on, the image's harness recomputes at start the hashes this CLI writes
      # and refuses to run on a mismatch. So the version is read from the
      # service Dockerfile's FROM line, the one place it is written: a runtime
      # upgrade is a change to that line alone, and the step after the install
      # checks that the CLI is that version.
      - name: Read the runtime version from the service image
        id: runtime
        run: |
          version="$(python3 scripts/image_pins.py runtime-version "services/${{ needs.check-single-service.outputs.service }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install continuo-python-runtime
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          uv tool install "continuo-python-runtime==${RUNTIME_VERSION}" || \
            uv tool install "git+https://github.com/carolsimone/continuo-python-runtime@v${RUNTIME_VERSION}"

      - name: Check the installed runtime is the image's
        # `--color never` keeps forced-colour escapes out of uv's output, and the
        # output is captured first because GitHub's default shell has no pipefail:
        # a failing `uv tool list` would otherwise read as "not installed".
        run: |
          listed="$(uv tool list --color never)"
          python3 scripts/image_pins.py check-installed "services/${{ needs.check-single-service.outputs.service }}" <<< "$listed"

      - name: Lint python scripts (no hand-written SQL)
        run: continuo-runtime lint "services/${{ needs.check-single-service.outputs.service }}/scripts"

      - name: Validate python contracts
        run: continuo-runtime validate "services/${{ needs.check-single-service.outputs.service }}/contracts" --dialect postgres

      # A dry run: CI builds no image, so the pack gets an empty package
      # listing (--image-packages) where the release's pack gets the pushed
      # image (--image). It writes a bundle nothing reads and reaches no object
      # storage; it only surfaces a pack failure on the PR rather than in the
      # release.
      - name: Dry-run the ODCS bundle pack
        run: |
          echo '{}' > "${RUNNER_TEMP}/packages.json"
          continuo-runtime pack "services/${{ needs.check-single-service.outputs.service }}/contracts" \
            --service "${{ needs.check-single-service.outputs.service }}" \
            --repo-root "services/${{ needs.check-single-service.outputs.service }}" \
            --dialect postgres \
            --image-packages "${RUNNER_TEMP}/packages.json" \
            --out "${RUNNER_TEMP}/odcs-bundle.json"

  # A dbt image pins every dbt package, so a rebuild cannot change the macros
  # dbt runs without a reviewed change to its Dockerfile.
  dbt-checks:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'dbt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the dbt pins of the service image
        run: python3 scripts/image_pins.py check-dbt "services/${{ needs.check-single-service.outputs.service }}"

  # continuo's producer-side lite check, on the changed dbt service: the part of
  # the release's own contract checks that needs no running continuo. It parses
  # the project and reports what the release would reject, such as a seed whose
  # declared columns differ from its CSV header, two nodes that share a contract
  # id, or a node whose service is not the one the project deploys under. A
  # passing check does not guarantee the release: the release has more stages.
  # dbt runs from a Python 3.12 virtualenv built from the service image's own
  # pins (the library needs Python 3.14, so it is a separate tool) and the check
  # is given that dbt with --dbt.
  dbt-lite-check:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'dbt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVICE: ${{ needs.check-single-service.outputs.service }}
      # The continuo-contracts version that continuo's topology-controller/pyproject.toml pins on main.
      CONTINUO_CONTRACTS_VERSION: "0.3.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The requirements are read into a variable first, so that a Dockerfile
      # image_pins.py refuses fails the step with its own message.
      - name: Install the dbt the service image pins
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/dbt"
          requirements="$(python3 scripts/image_pins.py dbt-requirements "services/${SERVICE}")"
          # One requirement per line, split into one argument each on purpose; none holds a glob character.
          # shellcheck disable=SC2086
          uv pip install --python "$RUNNER_TEMP/dbt/bin/python" $requirements

      - name: Install continuo-contracts
        run: uv tool install --python 3.14 "continuo-contracts==${CONTINUO_CONTRACTS_VERSION}"

      - name: Check the dbt project with continuo's lite check
        run: continuo-contracts dbt check "services/${SERVICE}" --dbt "$RUNNER_TEMP/dbt/bin/dbt"

  # The scripts CI and CD run, and the wiring of the workflows, are tested on
  # every change to them: release.sh against a stub of continuo's release API,
  # the image pins, and the text of both workflows.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck release.sh
        run: shellcheck scripts/release.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Test the scripts
        run: uvx pytest==9.1.1 scripts/tests/test_release_sh.py scripts/tests/test_image_pins.py scripts/tests/test_workflows.py -v
