version: 2

models:
  - name: daily_transactions
    description: "Basic union of core card transactions and finance FX transactions, valued in EUR. transaction_id is not unique across sources; use `source` to disambiguate."
    columns:
      - name: transaction_id
        description: "Source-local transaction id (not unique across sources)."
        tests:
          - not_null
      - name: amount_eur
        description: "Transaction value in EUR. Card amounts are treated as already-EUR; FX amounts come pre-converted from fx_transactions_eur."
        tests:
          - not_null
      - name: fee_amount_eur
        description: "Revenue: the fee the company earned on this transaction, in EUR. Card fees are already EUR; FX fees come pre-converted from fx_transactions_eur."
        tests:
          - not_null
      - name: source
        description: "Origin of the row: 'card' (seed_card_transactions) or 'fx' (analytics.fx_transactions_eur)."
        tests:
          - not_null

  - name: revenue_per_user
    description: "Per-user realized revenue over the observation window: the fees the company earned, not the volume the customer moved. One row per user; users with no transactions carry revenue_eur 0. Input to finance's ltv_per_user."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: acquisition_month
        tests:
          - not_null
      - name: revenue_eur
        description: "Sum of fee_amount_eur across this user's transactions. Zero for users with none."
        tests:
          - not_null
      - name: gross_volume_eur
        description: "Sum of amount_eur. Carried beside revenue_eur so the volume/revenue distinction stays visible."
        tests:
          - not_null

seeds:
  - name: seed_card_transactions
    description: "Card transaction seed rows, one row per transaction, in EUR. Generated by scripts/gen_transactions.py — edit that script, not this CSV."
    columns:
      - name: transaction_id
        description: "Transaction id, unique within this seed."
      - name: user_id
        description: "Id of the user the transaction belongs to."
      - name: amount
        description: "Transaction amount, in EUR."
      - name: payer
        description: "Paying party, written as 'user <user_id>'."
      - name: receiver
        description: "Receiving party, a merchant name."
      - name: created_at
        description: "Timestamp when the transaction was created."
      - name: fee_amount
        description: "Fee the company earned on this transaction, in EUR (card transactions have no currency conversion)."
        tests:
          - not_null

  - name: seed_fx_transactions
    description: "FX transaction seed rows, one row per transaction, denominated in currency_from. Generated by scripts/gen_transactions.py — edit that script, not this CSV."
    columns:
      - name: transaction_id
        description: "Transaction id, unique within this seed."
      - name: user_id
        description: "Id of the user the transaction belongs to."
      - name: amount
        description: "Transaction amount, denominated in currency_from."
      - name: currency_from
        description: "Currency the amount is denominated in, as a three-letter code."
      - name: currency_to
        description: "Currency the amount is exchanged into, as a three-letter code."
      - name: rate
        description: "Exchange rate from currency_from to currency_to."
      - name: created_at
        description: "Timestamp when the transaction was created."
      - name: fee_amount
        description: "Fee the company earned on this transaction, denominated in currency_from before EUR conversion in finance's fx_transactions_eur."
        tests:
          - not_null

  - name: seed_users
    description: "Demo users, one row per user. name, email and birth_year are personal data."
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: name
        meta: {continuo: {classification: personal}}
      - name: email
        meta: {continuo: {classification: personal}}
      - name: birth_year
        meta: {continuo: {classification: personal}}
      - name: created_at
