version: 2

models:
  - name: daily_transactions
    description: "Card and FX transactions in one table, valued in EUR. transaction_id is unique within a source, not across sources."
    meta:
      continuo:
        entity: Transaction               # union of both sources; `source` is part of the key
        readers: [finance, analytics]
    columns:
      - name: transaction_id
        description: "Source-local transaction id."
        tests:
          - not_null
      - name: user_id
      - name: amount_eur
        description: "Transaction value in EUR. Negative for a card refund."
        tests:
          - not_null
      - name: fee_amount_eur
        description: "Fee on the transaction, in EUR. A card refund returns its purchase's fee."
        tests:
          - not_null
      - name: created_at
      - name: source
        description: "card or fx."
        tests:
          - not_null

  - name: revenue_per_user
    description: "One row per user: transaction count, volume and fee revenue over the observation window. Input to finance's ltv_per_user."
    meta:
      continuo:
        entity: UserRevenue
        readers: [finance]
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: acquired_at
        meta: {continuo: {property: User.created_at}}
      - name: acquisition_month
        tests:
          - not_null
      - name: transaction_count
        meta: {continuo: {local: true}}
      - name: revenue_eur
        tests:
          - not_null
      - name: gross_volume_eur
        tests:
          - not_null
      - name: first_transaction_at
        meta: {continuo: {local: true}}
      - name: last_transaction_at
        meta: {continuo: {local: true}}

  - name: user_activity_monthly
    description: "One row per user per month, from the user's acquisition month to the last month with any transaction, with the user's running fee revenue. Input to finance's ltv_cac_by_channel_cohort."
    meta:
      continuo:
        grain: [user, month]
        readers: [finance]
    columns:
      - name: user_id
        meta: {continuo: {from: Transaction.user_id}}
        tests:
          - not_null
      - name: activity_month
        meta: {continuo: {period: month, from: Transaction.created_at}}
        tests:
          - not_null
      - name: acquisition_month
        meta: {continuo: {local: true}}
        tests:
          - not_null
      - name: months_since_acquisition
        meta: {continuo: {local: true}}
        tests:
          - not_null
      - name: transaction_count
        meta: {continuo: {from: Transaction, agg: count}}
        tests:
          - not_null
      - name: volume_eur
        meta: {continuo: {from: Transaction.amount_eur, agg: sum}}
        tests:
          - not_null
      - name: fee_revenue_eur
        meta: {continuo: {from: Transaction.fee_amount_eur, agg: sum}}
        tests:
          - not_null
      - name: cumulative_fee_revenue_eur
        meta: {continuo: {local: true}}
        tests:
          - not_null
      - name: is_active
        meta: {continuo: {local: true}}
      - name: was_active_last_month
        meta: {continuo: {local: true}}

  - name: fx_corridor_monthly
    description: "FX volume and fee revenue per currency pair per month, valued in EUR."
    meta: {continuo: {grain: [currency_from, currency_to, month]}}
    columns:
      - name: currency_from
        meta: {continuo: {local: true}}
        tests:
          - not_null
      - name: currency_to
        meta: {continuo: {local: true}}
        tests:
          - not_null
      - name: fx_month
        meta: {continuo: {period: month, from: Transaction.created_at}}
        tests:
          - not_null
      - name: transaction_count
        meta: {continuo: {from: Transaction, agg: count}}
      - name: active_users
        meta: {continuo: {local: true}}
      - name: volume_eur
        meta: {continuo: {from: Transaction.amount_eur, agg: sum}}
      - name: fee_revenue_eur
        meta: {continuo: {from: Transaction.fee_amount_eur, agg: sum}}
      - name: take_rate
        meta: {continuo: {local: true}}
      - name: share_of_month_volume
        meta: {continuo: {local: true}}

  - name: read_order
    meta: {continuo: {entity: Order}}       # copy of service-py's demo_orders_csv
    columns:
      - name: order_id
      - name: customer
      - name: amount

  - name: read_order_v2
    meta: {continuo: {entity: Order}}       # copy of read_order
    columns:
      - name: order_id
      - name: customer
      - name: amount

  - name: dbt_daily_kpis
    meta: {continuo: {grain: [day]}}        # copy of service-py's py_daily_kpis
    columns:
      - name: day
        meta: {continuo: {period: day, from: Transaction.created_at}}
      - name: tx_count
        meta: {continuo: {from: Transaction, agg: count}}
      - name: total_amount
        meta: {continuo: {from: Transaction.amount_eur, agg: sum}}

seeds:
  - name: seed_card_transactions
    description: "Card transaction seed rows, one row per transaction, in EUR. A refund is its own row, with the purchase's amount and fee negated. Generated by scripts/gen_transactions.py — edit that script, not this CSV."
    meta:
      continuo:
        entity: Transaction
        fixed: {source: card}
    columns:
      - name: transaction_id
        description: "Transaction id, unique within this seed."
      - name: user_id
        description: "Id of the user the transaction belongs to."
      - name: amount
        description: "Transaction amount, in EUR."
        meta: {continuo: {property: Transaction.amount_eur}}   # card amounts are already EUR
      - name: payer
        description: "Paying party, written as 'user <user_id>'."
        meta: {continuo: {local: true}}
      - name: receiver
        description: "Receiving party, a merchant name."
        meta: {continuo: {local: true}}
      - name: created_at
        description: "Timestamp when the transaction was created."
      - name: fee_amount
        description: "Fee on the transaction, in EUR."
        meta: {continuo: {property: Transaction.fee_amount_eur}}
        tests:
          - not_null

  - name: seed_fx_transactions
    description: "FX transaction seed rows, one row per transaction, denominated in currency_from. Generated by scripts/gen_transactions.py — edit that script, not this CSV."
    meta:
      continuo:
        entity: Transaction
        fixed: {source: fx}
        readers: [finance]
    columns:
      # amount and fee_amount are in currency_from, not EUR: this copy does not
      # carry Transaction.amount_eur or fee_amount_eur. finance's
      # fx_transactions_eur is the copy that does.
      - name: transaction_id
        description: "Transaction id, unique within this seed."
      - name: user_id
        description: "Id of the user the transaction belongs to."
      - name: amount
        description: "Transaction amount, denominated in currency_from."
        meta: {continuo: {local: true}}
      - name: currency_from
        description: "Currency the amount is denominated in, as a three-letter code."
        meta: {continuo: {local: true}}
      - name: currency_to
        description: "Currency the amount is exchanged into, as a three-letter code."
        meta: {continuo: {local: true}}
      - name: rate
        description: "Exchange rate from currency_from to currency_to."
        meta: {continuo: {local: true}}
      - name: created_at
        description: "Timestamp when the transaction was created."
      - name: fee_amount
        description: "Fee on the transaction, denominated in currency_from."
        meta: {continuo: {local: true}}
        tests:
          - not_null

  - name: seed_users
    description: "Demo users, one row per user. name, email and birth_year are personal data."
    meta:
      continuo:
        entity: User
        readers: [finance]        # finance's operational_cost_per_user reads it; the personal columns stay core's
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: name
        meta: {continuo: {classification: personal}}
      - name: email
        meta: {continuo: {classification: personal}}
      - name: birth_year
        meta: {continuo: {classification: personal}}
      - name: created_at
